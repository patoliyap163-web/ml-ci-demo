
name: ML CI Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHON_VERSION: "3.11"
      MODEL_RANDOM_STATE: "42"
      MODEL_MAX_DEPTH: "None"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests

      - name: Data integrity tests
        run: python -m pytest tests/test_data.py -v

      - name: Train model
        run: python -m src.train
        env:
          MODEL_RANDOM_STATE: ${{ env.MODEL_RANDOM_STATE }}
          MODEL_MAX_DEPTH: ${{ env.MODEL_MAX_DEPTH }}

      - name: Display model metrics
        run: |
          echo '### Model Metrics' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat metrics.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Model quality gate
        run: python -m pytest tests/test_model.py -v

      - name: Prepare deployment package
        run: |
          mkdir -p deployment
          cp model.joblib deployment/
          cp metrics.json deployment/
          echo "Deployment package prepared successfully."

      - name: Deploy model artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mushroom-model-deployment
          path: deployment/
          retention-days: 14
